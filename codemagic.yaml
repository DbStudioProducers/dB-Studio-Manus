workflows:
  dbstudio-android-apk:
    name: dB Studio Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      node: 22.23.4
      vars:
        PACKAGE_NAME: "com.dbstudio.mobile"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Enable pnpm
        script: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Generate Android native project with Expo
        script: |
          cd "$CM_BUILD_DIR/mobile"
          CI=1 pnpm exec expo prebuild --platform android --no-install
      - name: Configure Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
      - name: Build Android release APK
        script: |
          cd "$CM_BUILD_DIR/mobile/android"
          ./gradlew assembleRelease --no-daemon --stacktrace
    artifacts:
      - mobile/android/app/build/outputs/apk/release/*.apk
      - mobile/android/app/build/outputs/apk/release/output-metadata.json
      - /tmp/*.log
    publishing:
      email:
        recipients:
          - yggdrasilagencia@gmail.com
        notify:
          success: true
          failure: true
